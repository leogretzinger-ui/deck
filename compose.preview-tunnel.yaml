# Opt-in ingress only; DNS administration credentials never enter the app.
services:
  preview-tunnel:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy
    command: ["--no-autoupdate", "tunnel", "--loglevel", "warn", "run", "--token-file", "/run/secrets/preview-token"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${NOISEDECK_PREVIEW_TUNNEL_TOKEN_FILE:?set the host connector token path}:/run/secrets/preview-token:ro,Z
      - type: bind
        source: ./deploy/sidecar-resolv.conf
        target: /etc/resolv.conf
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
